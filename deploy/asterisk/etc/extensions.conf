[general]
static = yes
writeprotect = yes

; Calls from the gateway arrive addressed to its inbound target (default: its own SIP user).
; Anything else in this context is refused; the gateway context cannot reach anything else.
[from-gateway]
; Handed to the bot's ARI app (src/calls/), which answers and bridges the call to
; Gemini Live. If the bot isn't connected, Stasis() fails and the caller gets busy
; (the phone then rejects the cellular call) instead of a dead answered line.
exten => android-gw,1,NoOp(Cellular call from ${CALLERID(num)})
 same => n,Stasis(karyasthan,inbound)
 same => n,Hangup(17)

; Manual audio-path test: change the gateway's inbound target to "echo" to get the
; plain Asterisk echo used to verify the phone ↔ server audio path.
exten => echo,1,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

exten => _[+0-9a-zA-Z].,1,Hangup(21)
exten => i,1,Hangup(21)

; Server-side audio test (scripts/call-loopback-test.js): records what the ARI app
; sends into a call, without the phone. Reachable only via ARI originate (Local/).
[calltest]
exten => sink,1,Answer()
 same => n,Record(/tmp/calltest-sink.wav,0,6,qk)
 same => n,Hangup()
