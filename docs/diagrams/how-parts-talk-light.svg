<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The mind, reply engine, life engine and event log connected by labelled arrows."><defs><style>svg{color:#1f2328} .t{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .tt{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .ts{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#566675}  .lab{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}  .rowh{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.07em;fill:#6a45c2}  .tag{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#566675}  .b{stroke-width:1.5}  .code{fill:#e9eef3;stroke:#7c8c9a}  .model{fill:#efe8fb;stroke:#6a45c2}  .chat{fill:#fdf1da;stroke:#b77a12}  .store{fill:#e0f3ef;stroke:#17806f}  .owner{fill:#fde6ee;stroke:#b92d62}  .inner{fill:none;stroke:#6a45c2;stroke-width:.8}  .a{fill:none;stroke:currentColor;stroke-width:1.5}  .head{fill:currentColor}  .wall{stroke:#c23b3b;stroke-width:2.5;stroke-dasharray:7 5}  .now{stroke:#c23b3b;stroke-width:2}  .axis{stroke:currentColor;stroke-width:1.5}  .thin{stroke:#566675;stroke-width:1}  .grid{stroke:#d5dde4;stroke-width:1}  .dot{fill:currentColor}  .chatdot{fill:#b77a12}  .zone{fill:none;stroke:#d5dde4;stroke-width:1.5;stroke-dasharray:4 4}  .g-now{fill:#1f9d85}  .g-sneak{fill:#74c2ae}  .g-react{fill:#d9b45c}  .g-defer{fill:#8d80d6}  .g-ignore{fill:#b9c4cd}  .gt{font:600 12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#0e1820}  .gt2{font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .chain-on{fill:#efe8fb;stroke:#6a45c2}  .chain-off{fill:none;stroke:#d5dde4}  .u-neg{fill:#e6b8b8}  .u-pos{fill:#a9dccf}  .u-pos2{fill:#7fc9b6}  .u-word{fill:#c9b6f2}</style><marker id="m15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><rect x="480" y="30" width="240" height="90" rx="7" class="b model"/><rect x="484" y="34" width="232" height="82" rx="4" class="inner"/><text x="600.0" y="71.5" class="tt" text-anchor="middle">The mind</text><text x="600.0" y="88.5" class="ts" text-anchor="middle">thinks, sleeps, proposes</text><rect x="60" y="200" width="240" height="90" rx="7" class="b model"/><rect x="64" y="204" width="232" height="82" rx="4" class="inner"/><text x="180.0" y="241.5" class="tt" text-anchor="middle">Reply engine</text><text x="180.0" y="258.5" class="ts" text-anchor="middle">gate, score, mouth</text><rect x="900" y="200" width="240" height="90" rx="7" class="b code"/><text x="1020.0" y="241.5" class="tt" text-anchor="middle">Life engine</text><text x="1020.0" y="258.5" class="ts" text-anchor="middle">pulse, decisions, plan</text><rect x="480" y="360" width="240" height="90" rx="7" class="b store"/><text x="600.0" y="401.5" class="tt" text-anchor="middle">The event log</text><text x="600.0" y="418.5" class="ts" text-anchor="middle">what actually happened</text><polyline points="480,90 180,90 180,200" class="a" marker-end="url(#m15)"/><text x="330" y="80" class="lab" text-anchor="middle">knobs: response rate, length, reactions</text><polyline points="180,200 240,150 480,110" class="a" marker-end="url(#m15)"/><text x="300" y="174" class="lab" text-anchor="start">its lines, as digests</text><polyline points="720,75 1020,75 1020,200" class="a" marker-end="url(#m15)"/><text x="870" y="65" class="lab" text-anchor="middle">interests: ±0.6 on go, picks × 0.25 to 2</text><polyline points="960,200 880,130 720,105" class="a" marker-end="url(#m15)"/><text x="830" y="170" class="lab" text-anchor="start">tick, life view</text><polyline points="900,225 300,225" class="a" marker-end="url(#m15)"/><text x="600" y="216" class="lab" text-anchor="middle">availability, inner state, plans</text><polyline points="300,265 900,265" class="a" marker-end="url(#m15)"/><text x="600" y="256" class="lab" text-anchor="middle">chat mood, load, invitations: facts, never words</text><polyline points="1020,290 1020,405 720,405" class="a" marker-end="url(#m15)"/><text x="870" y="396" class="lab" text-anchor="middle">every event, with its cause</text><polyline points="480,405 180,405 180,290" class="a" marker-end="url(#m15)"/><text x="330" y="396" class="lab" text-anchor="middle">reads, never writes</text><polyline points="600,360 600,120" class="a" marker-end="url(#m15)"/><text x="612" y="330" class="lab" text-anchor="start">evidence: events only, so a reflection can’t cite a reflection</text></svg>
