<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The mind, reply engine, life engine and event log connected by labelled arrows."><defs><style>svg{color:#e6edf3} .t{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .tt{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .ts{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#93a4b3}  .lab{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor;paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}  .rowh{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.07em;fill:#a58bf0}  .tag{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#93a4b3}  .b{stroke-width:1.5}  .code{fill:#1f2933;stroke:#6d7f8e}  .model{fill:#261d40;stroke:#a58bf0}  .chat{fill:#35290f;stroke:#e0a93f}  .store{fill:#10302c;stroke:#46c4ae}  .owner{fill:#3b1826;stroke:#ef7fa8}  .inner{fill:none;stroke:#a58bf0;stroke-width:.8}  .a{fill:none;stroke:currentColor;stroke-width:1.5}  .head{fill:currentColor}  .wall{stroke:#ef7a7a;stroke-width:2.5;stroke-dasharray:7 5}  .now{stroke:#ef7a7a;stroke-width:2}  .axis{stroke:currentColor;stroke-width:1.5}  .thin{stroke:#93a4b3;stroke-width:1}  .grid{stroke:#2b3742;stroke-width:1}  .dot{fill:currentColor}  .chatdot{fill:#e0a93f}  .zone{fill:none;stroke:#2b3742;stroke-width:1.5;stroke-dasharray:4 4}  .g-now{fill:#2bb59a}  .g-sneak{fill:#6fbfab}  .g-react{fill:#d7b25b}  .g-defer{fill:#9184de}  .g-ignore{fill:#7d8b97}  .gt{font:600 12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#0e1820}  .gt2{font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .chain-on{fill:#261d40;stroke:#a58bf0}  .chain-off{fill:none;stroke:#2b3742}  .u-neg{fill:#6b3b3b}  .u-pos{fill:#28665a}  .u-pos2{fill:#2f8071}  .u-word{fill:#5b469c}</style><marker id="m15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><rect x="480" y="30" width="240" height="90" rx="7" class="b model"/><rect x="484" y="34" width="232" height="82" rx="4" class="inner"/><text x="600.0" y="71.5" class="tt" text-anchor="middle">The mind</text><text x="600.0" y="88.5" class="ts" text-anchor="middle">thinks, sleeps, proposes</text><rect x="60" y="200" width="240" height="90" rx="7" class="b model"/><rect x="64" y="204" width="232" height="82" rx="4" class="inner"/><text x="180.0" y="241.5" class="tt" text-anchor="middle">Reply engine</text><text x="180.0" y="258.5" class="ts" text-anchor="middle">gate, score, mouth</text><rect x="900" y="200" width="240" height="90" rx="7" class="b code"/><text x="1020.0" y="241.5" class="tt" text-anchor="middle">Life engine</text><text x="1020.0" y="258.5" class="ts" text-anchor="middle">pulse, decisions, plan</text><rect x="480" y="360" width="240" height="90" rx="7" class="b store"/><text x="600.0" y="401.5" class="tt" text-anchor="middle">The event log</text><text x="600.0" y="418.5" class="ts" text-anchor="middle">what actually happened</text><polyline points="480,90 180,90 180,200" class="a" marker-end="url(#m15)"/><text x="330" y="80" class="lab" text-anchor="middle">knobs: response rate, length, reactions</text><polyline points="180,200 240,150 480,110" class="a" marker-end="url(#m15)"/><text x="300" y="174" class="lab" text-anchor="start">its lines, as digests</text><polyline points="720,75 1020,75 1020,200" class="a" marker-end="url(#m15)"/><text x="870" y="65" class="lab" text-anchor="middle">interests: ±0.6 on go, picks × 0.25 to 2</text><polyline points="960,200 880,130 720,105" class="a" marker-end="url(#m15)"/><text x="830" y="170" class="lab" text-anchor="start">tick, life view</text><polyline points="900,225 300,225" class="a" marker-end="url(#m15)"/><text x="600" y="216" class="lab" text-anchor="middle">availability, inner state, plans</text><polyline points="300,265 900,265" class="a" marker-end="url(#m15)"/><text x="600" y="256" class="lab" text-anchor="middle">chat mood, load, invitations: facts, never words</text><polyline points="1020,290 1020,405 720,405" class="a" marker-end="url(#m15)"/><text x="870" y="396" class="lab" text-anchor="middle">every event, with its cause</text><polyline points="480,405 180,405 180,290" class="a" marker-end="url(#m15)"/><text x="330" y="396" class="lab" text-anchor="middle">reads, never writes</text><polyline points="600,360 600,120" class="a" marker-end="url(#m15)"/><text x="612" y="330" class="lab" text-anchor="start">evidence: events only, so a reflection can’t cite a reflection</text></svg>
