<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Three rows of components: seconds for replies, minutes for life decisions, nights for the mind, joined by one event log, with feedback arrows from who he is now into decisions and replies."><defs><style>svg{color:#e6edf3} .t{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .tt{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .ts{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#93a4b3}  .lab{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor;paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}  .rowh{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.07em;fill:#a58bf0}  .tag{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#93a4b3}  .b{stroke-width:1.5}  .code{fill:#1f2933;stroke:#6d7f8e}  .model{fill:#261d40;stroke:#a58bf0}  .chat{fill:#35290f;stroke:#e0a93f}  .store{fill:#10302c;stroke:#46c4ae}  .owner{fill:#3b1826;stroke:#ef7fa8}  .inner{fill:none;stroke:#a58bf0;stroke-width:.8}  .a{fill:none;stroke:currentColor;stroke-width:1.5}  .head{fill:currentColor}  .wall{stroke:#ef7a7a;stroke-width:2.5;stroke-dasharray:7 5}  .now{stroke:#ef7a7a;stroke-width:2}  .axis{stroke:currentColor;stroke-width:1.5}  .thin{stroke:#93a4b3;stroke-width:1}  .grid{stroke:#2b3742;stroke-width:1}  .dot{fill:currentColor}  .chatdot{fill:#e0a93f}  .zone{fill:none;stroke:#2b3742;stroke-width:1.5;stroke-dasharray:4 4}  .g-now{fill:#2bb59a}  .g-sneak{fill:#6fbfab}  .g-react{fill:#d7b25b}  .g-defer{fill:#9184de}  .g-ignore{fill:#7d8b97}  .gt{font:600 12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#0e1820}  .gt2{font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .chain-on{fill:#261d40;stroke:#a58bf0}  .chain-off{fill:none;stroke:#2b3742}  .u-neg{fill:#6b3b3b}  .u-pos{fill:#28665a}  .u-pos2{fill:#2f8071}  .u-word{fill:#5b469c}</style><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><text x="20" y="84" class="rowh" text-anchor="start">SECONDS</text><text x="20" y="102" class="ts" text-anchor="start">a message arrives</text><text x="20" y="264" class="rowh" text-anchor="start">MINUTES</text><text x="20" y="282" class="ts" text-anchor="start">the day moves</text><text x="20" y="524" class="rowh" text-anchor="start">NIGHTS</text><text x="20" y="542" class="ts" text-anchor="start">the day settles</text><rect x="170" y="46" width="176" height="84" rx="7" class="b chat"/><text x="258.0" y="84.5" class="tt" text-anchor="middle">WhatsApp message</text><text x="258.0" y="101.5" class="ts" text-anchor="middle">a group or a DM</text><rect x="372" y="46" width="176" height="84" rx="7" class="b code"/><text x="460.0" y="84.5" class="tt" text-anchor="middle">Availability gate</text><text x="460.0" y="101.5" class="ts" text-anchor="middle">free, busy, asleep?</text><rect x="574" y="46" width="176" height="84" rx="7" class="b code"/><text x="662.0" y="84.5" class="tt" text-anchor="middle">Reply score</text><text x="662.0" y="101.5" class="ts" text-anchor="middle">worth answering?</text><rect x="776" y="46" width="176" height="84" rx="7" class="b model"/><rect x="780" y="50" width="168" height="76" rx="4" class="inner"/><text x="864.0" y="84.5" class="tt" text-anchor="middle">Mouth</text><text x="864.0" y="101.5" class="ts" text-anchor="middle">writes the reply</text><rect x="978" y="46" width="176" height="84" rx="7" class="b chat"/><text x="1066.0" y="84.5" class="tt" text-anchor="middle">Sent, with a delay</text><text x="1066.0" y="101.5" class="ts" text-anchor="middle">typing, read receipt</text><polyline points="346,88 372,88" class="a" marker-end="url(#m1)"/><polyline points="548,88 574,88" class="a" marker-end="url(#m1)"/><polyline points="750,88 776,88" class="a" marker-end="url(#m1)"/><polyline points="952,88 978,88" class="a" marker-end="url(#m1)"/><rect x="170" y="226" width="176" height="84" rx="7" class="b code"/><text x="258.0" y="264.5" class="tt" text-anchor="middle">Life pulse</text><text x="258.0" y="281.5" class="ts" text-anchor="middle">every 15 min</text><rect x="372" y="226" width="176" height="84" rx="7" class="b code"/><text x="460.0" y="264.5" class="tt" text-anchor="middle">Decisions</text><text x="460.0" y="281.5" class="ts" text-anchor="middle">options priced in code</text><rect x="574" y="226" width="176" height="84" rx="7" class="b model"/><rect x="578" y="230" width="168" height="76" rx="4" class="inner"/><text x="662.0" y="264.5" class="tt" text-anchor="middle">Jev lean</text><text x="662.0" y="281.5" class="ts" text-anchor="middle">typed choice, on triggers</text><rect x="776" y="226" width="176" height="84" rx="7" class="b code"/><text x="864.0" y="264.5" class="tt" text-anchor="middle">Plan and activity</text><text x="864.0" y="281.5" class="ts" text-anchor="middle">goes out, stays in</text><rect x="978" y="226" width="176" height="84" rx="7" class="b model"/><rect x="982" y="230" width="168" height="76" rx="4" class="inner"/><text x="1066.0" y="264.5" class="tt" text-anchor="middle">Words for it</text><text x="1066.0" y="281.5" class="ts" text-anchor="middle">scene, text, real thought</text><polyline points="346,268 372,268" class="a" marker-end="url(#m1)"/><polyline points="548,268 574,268" class="a" marker-end="url(#m1)"/><polyline points="750,268 776,268" class="a" marker-end="url(#m1)"/><polyline points="952,268 978,268" class="a" marker-end="url(#m1)"/><rect x="170" y="370" width="984" height="58" rx="7" class="b store"/><text x="662" y="395" class="tt" text-anchor="middle">The one record of its life</text><text x="662" y="414" class="ts" text-anchor="middle">an append-only event log (world_events) and scoped memory: undo is a revert or a rewind, nothing is overwritten</text><polyline points="258,310 258,370" class="a" marker-end="url(#m1)"/><polyline points="864,310 864,370" class="a" marker-end="url(#m1)"/><text x="872" y="344" class="lab" text-anchor="start">appends</text><polyline points="1066,310 1066,370" class="a" marker-end="url(#m1)"/><polyline points="351,370 351,164 440,164 440,130" class="a" marker-end="url(#m1)"/><text x="360" y="182" class="lab" text-anchor="start">reads state, never writes</text><rect x="170" y="486" width="176" height="84" rx="7" class="b model"/><rect x="174" y="490" width="168" height="76" rx="4" class="inner"/><text x="258.0" y="516.0" class="tt" text-anchor="middle">Glance</text><text x="258.0" y="533.0" class="ts" text-anchor="middle">Jev, about every 45 min</text><text x="258.0" y="550.0" class="ts" text-anchor="middle">counts only, no words</text><rect x="372" y="486" width="176" height="84" rx="7" class="b model"/><rect x="376" y="490" width="168" height="76" rx="4" class="inner"/><text x="460.0" y="516.0" class="tt" text-anchor="middle">Think</text><text x="460.0" y="533.0" class="ts" text-anchor="middle">deep model, daily</text><text x="460.0" y="550.0" class="ts" text-anchor="middle">reads clerk digests</text><rect x="574" y="486" width="176" height="84" rx="7" class="b model"/><rect x="578" y="490" width="168" height="76" rx="4" class="inner"/><text x="662.0" y="516.0" class="tt" text-anchor="middle">Sleep</text><text x="662.0" y="533.0" class="ts" text-anchor="middle">deep model, once a night</text><text x="662.0" y="550.0" class="ts" text-anchor="middle">episodes, reflection</text><rect x="776" y="486" width="176" height="84" rx="7" class="b store"/><text x="864.0" y="516.0" class="tt" text-anchor="middle">Who it is now</text><text x="864.0" y="533.0" class="ts" text-anchor="middle">self-state, self-model</text><text x="864.0" y="550.0" class="ts" text-anchor="middle">interests, how things stand</text><rect x="978" y="486" width="176" height="84" rx="7" class="b code"/><text x="1066.0" y="516.0" class="tt" text-anchor="middle">Dream</text><text x="1066.0" y="533.0" class="ts" text-anchor="middle">planned in code at the wake</text><text x="1066.0" y="550.0" class="ts" text-anchor="middle">a vivid one gets a model</text><polyline points="346,528 372,528" class="a" marker-end="url(#m1)"/><polyline points="548,528 574,528" class="a" marker-end="url(#m1)"/><polyline points="750,528 776,528" class="a" marker-end="url(#m1)"/><polyline points="460,428 460,486" class="a" marker-end="url(#m1)"/><text x="468" y="462" class="lab" text-anchor="start">reads</text><polyline points="662,428 662,486" class="a" marker-end="url(#m1)"/><polyline points="1066,428 1066,486" class="a" marker-end="url(#m1)"/><text x="1074" y="462" class="lab" text-anchor="start">the day before</text><polyline points="864,486 864,446 1176,446 1176,204 458,204 458,226" class="a" marker-end="url(#m1)"/><text x="760" y="197" class="lab" text-anchor="middle">bends the next decision</text><polyline points="1176,204 1176,22 864,22 864,46" class="a" marker-end="url(#m1)"/><text x="1020" y="15" class="lab" text-anchor="middle">colours the next reply</text></svg>
