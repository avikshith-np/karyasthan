<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="A real chat passes through a wall as facts, memory or causes, which then reach replies, fictional writers, the dashboard and the public site under different rules."><defs><style>svg{color:#e6edf3} .t{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .tt{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .ts{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#93a4b3}  .lab{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor;paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}  .rowh{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.07em;fill:#a58bf0}  .tag{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#93a4b3}  .b{stroke-width:1.5}  .code{fill:#1f2933;stroke:#6d7f8e}  .model{fill:#261d40;stroke:#a58bf0}  .chat{fill:#35290f;stroke:#e0a93f}  .store{fill:#10302c;stroke:#46c4ae}  .owner{fill:#3b1826;stroke:#ef7fa8}  .inner{fill:none;stroke:#a58bf0;stroke-width:.8}  .a{fill:none;stroke:currentColor;stroke-width:1.5}  .head{fill:currentColor}  .wall{stroke:#ef7a7a;stroke-width:2.5;stroke-dasharray:7 5}  .now{stroke:#ef7a7a;stroke-width:2}  .axis{stroke:currentColor;stroke-width:1.5}  .thin{stroke:#93a4b3;stroke-width:1}  .grid{stroke:#2b3742;stroke-width:1}  .dot{fill:currentColor}  .chatdot{fill:#e0a93f}  .zone{fill:none;stroke:#2b3742;stroke-width:1.5;stroke-dasharray:4 4}  .g-now{fill:#2bb59a}  .g-sneak{fill:#6fbfab}  .g-react{fill:#d7b25b}  .g-defer{fill:#9184de}  .g-ignore{fill:#7d8b97}  .gt{font:600 12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#0e1820}  .gt2{font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .chain-on{fill:#261d40;stroke:#a58bf0}  .chain-off{fill:none;stroke:#2b3742}  .u-neg{fill:#6b3b3b}  .u-pos{fill:#28665a}  .u-pos2{fill:#2f8071}  .u-word{fill:#5b469c}</style><marker id="m9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><rect x="30" y="100" width="240" height="120" rx="7" class="b chat"/><text x="150.0" y="156.5" class="tt" text-anchor="middle">A real chat</text><text x="150.0" y="173.5" class="ts" text-anchor="middle">words, names, phone numbers</text><line x1="350" y1="30" x2="350" y2="390" class="wall"/><text x="350" y="410" class="lab" text-anchor="middle">real words stop here</text><rect x="430" y="40" width="330" height="70" rx="7" class="b code"/><text x="595.0" y="71.5" class="tt" text-anchor="middle">A feeling, a load, a plan fact</text><text x="595.0" y="88.5" class="ts" text-anchor="middle">mood overlay, chat load, “busy Saturday”</text><rect x="430" y="140" width="330" height="70" rx="7" class="b code"/><text x="595.0" y="171.5" class="tt" text-anchor="middle">Same chat, or a chat of the same people</text><text x="595.0" y="188.5" class="ts" text-anchor="middle">only if all of them were there when it was learned</text><rect x="430" y="240" width="330" height="70" rx="7" class="b code"/><text x="595.0" y="271.5" class="tt" text-anchor="middle">From a chat: origin kept</text><text x="595.0" y="288.5" class="ts" text-anchor="middle">events it caused stay marked to that chat</text><polyline points="270,130 430,75" class="a" marker-end="url(#m9)"/><text x="340" y="92" class="lab" text-anchor="middle">as a fact</text><polyline points="270,160 430,175" class="a" marker-end="url(#m9)"/><text x="350" y="160" class="lab" text-anchor="middle">as memory</text><polyline points="270,190 430,275" class="a" marker-end="url(#m9)"/><text x="350" y="240" class="lab" text-anchor="middle">as a cause</text><rect x="860" y="30" width="310" height="70" rx="7" class="b model"/><rect x="864" y="34" width="302" height="62" rx="4" class="inner"/><text x="1015.0" y="61.5" class="tt" text-anchor="middle">Replies</text><text x="1015.0" y="78.5" class="ts" text-anchor="middle">through recall, per audience</text><rect x="860" y="130" width="310" height="70" rx="7" class="b model"/><rect x="864" y="134" width="302" height="62" rx="4" class="inner"/><text x="1015.0" y="161.5" class="tt" text-anchor="middle">Fictional writers</text><text x="1015.0" y="178.5" class="ts" text-anchor="middle">facts as “plans with a friend”, no words</text><rect x="860" y="230" width="310" height="70" rx="7" class="b store"/><text x="1015.0" y="261.5" class="tt" text-anchor="middle">Your dashboard</text><text x="1015.0" y="278.5" class="ts" text-anchor="middle">sees everything: it isn’t a prompt</text><rect x="860" y="330" width="310" height="70" rx="7" class="b code"/><text x="1015.0" y="361.5" class="tt" text-anchor="middle">Public site</text><text x="1015.0" y="378.5" class="ts" text-anchor="middle">filtered twice, scrubbed, canary-checked</text><polyline points="760,75 860,65" class="a" marker-end="url(#m9)"/><polyline points="760,75 860,160" class="a" marker-end="url(#m9)"/><polyline points="760,175 860,65" class="a" marker-end="url(#m9)"/><polyline points="760,275 860,265" class="a" marker-end="url(#m9)"/><polyline points="760,275 860,365" class="a" marker-end="url(#m9)"/><text x="776" y="366" class="lab" text-anchor="middle">dropped if chat-shaped</text></svg>
