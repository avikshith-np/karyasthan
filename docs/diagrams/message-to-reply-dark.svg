<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="440" viewBox="0 0 1184 440" role="img" aria-label="A pipeline from message through forget and relay, gate, score, pre-filter, mouth and quality gate to sent, with branches for react, ignore, defer and a capped reply."><defs><style>svg{color:#e6edf3} .t{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .tt{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .ts{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#93a4b3}  .lab{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor;paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}  .rowh{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.07em;fill:#a58bf0}  .tag{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#93a4b3}  .b{stroke-width:1.5}  .code{fill:#1f2933;stroke:#6d7f8e}  .model{fill:#261d40;stroke:#a58bf0}  .chat{fill:#35290f;stroke:#e0a93f}  .store{fill:#10302c;stroke:#46c4ae}  .owner{fill:#3b1826;stroke:#ef7fa8}  .inner{fill:none;stroke:#a58bf0;stroke-width:.8}  .a{fill:none;stroke:currentColor;stroke-width:1.5}  .head{fill:currentColor}  .wall{stroke:#ef7a7a;stroke-width:2.5;stroke-dasharray:7 5}  .now{stroke:#ef7a7a;stroke-width:2}  .axis{stroke:currentColor;stroke-width:1.5}  .thin{stroke:#93a4b3;stroke-width:1}  .grid{stroke:#2b3742;stroke-width:1}  .dot{fill:currentColor}  .chatdot{fill:#e0a93f}  .zone{fill:none;stroke:#2b3742;stroke-width:1.5;stroke-dasharray:4 4}  .g-now{fill:#2bb59a}  .g-sneak{fill:#6fbfab}  .g-react{fill:#d7b25b}  .g-defer{fill:#9184de}  .g-ignore{fill:#7d8b97}  .gt{font:600 12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#0e1820}  .gt2{font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:currentColor}  .chain-on{fill:#261d40;stroke:#a58bf0}  .chain-off{fill:none;stroke:#2b3742}  .u-neg{fill:#6b3b3b}  .u-pos{fill:#28665a}  .u-pos2{fill:#2f8071}  .u-word{fill:#5b469c}</style><marker id="m10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><rect x="24" y="60" width="140" height="84" rx="7" class="b chat"/><text x="94.0" y="90.0" class="tt" text-anchor="middle">Message</text><text x="94.0" y="107.0" class="ts" text-anchor="middle">stored, learned</text><text x="94.0" y="124.0" class="ts" text-anchor="middle">in the background</text><rect x="190" y="60" width="140" height="84" rx="7" class="b code"/><text x="260.0" y="90.0" class="tt" text-anchor="middle">Forget, relay</text><text x="260.0" y="107.0" class="ts" text-anchor="middle">handled first</text><text x="260.0" y="124.0" class="ts" text-anchor="middle">then mute</text><rect x="356" y="60" width="140" height="84" rx="7" class="b code"/><text x="426.0" y="90.0" class="tt" text-anchor="middle">Gate</text><text x="426.0" y="107.0" class="ts" text-anchor="middle">availability</text><text x="426.0" y="124.0" class="ts" text-anchor="middle">one of 5 outcomes</text><rect x="522" y="60" width="140" height="84" rx="7" class="b code"/><text x="592.0" y="90.0" class="tt" text-anchor="middle">Score</text><text x="592.0" y="107.0" class="ts" text-anchor="middle">8 factors, a roll</text><text x="592.0" y="124.0" class="ts" text-anchor="middle">worth answering?</text><rect x="688" y="60" width="140" height="84" rx="7" class="b model"/><rect x="692" y="64" width="132" height="76" rx="4" class="inner"/><text x="758.0" y="90.0" class="tt" text-anchor="middle">Pre-filter</text><text x="758.0" y="107.0" class="ts" text-anchor="middle">small model: reply?</text><text x="758.0" y="124.0" class="ts" text-anchor="middle">never on mentions</text><rect x="854" y="60" width="140" height="84" rx="7" class="b model"/><rect x="858" y="64" width="132" height="76" rx="4" class="inner"/><text x="924.0" y="90.0" class="tt" text-anchor="middle">Mouth</text><text x="924.0" y="107.0" class="ts" text-anchor="middle">writes, or [SKIP]</text><text x="924.0" y="124.0" class="ts" text-anchor="middle">web lookup if asked</text><rect x="1020" y="60" width="140" height="84" rx="7" class="b model"/><rect x="1024" y="64" width="132" height="76" rx="4" class="inner"/><text x="1090.0" y="90.0" class="tt" text-anchor="middle">Quality gate</text><text x="1090.0" y="107.0" class="ts" text-anchor="middle">cleanup, then a</text><text x="1090.0" y="124.0" class="ts" text-anchor="middle">score threshold</text><polyline points="164,102 190,102" class="a" marker-end="url(#m10)"/><polyline points="330,102 356,102" class="a" marker-end="url(#m10)"/><polyline points="496,102 522,102" class="a" marker-end="url(#m10)"/><text x="509" y="52" class="lab" text-anchor="middle">now, sneak</text><polyline points="662,102 688,102" class="a" marker-end="url(#m10)"/><polyline points="828,102 854,102" class="a" marker-end="url(#m10)"/><polyline points="994,102 1020,102" class="a" marker-end="url(#m10)"/><rect x="1020" y="216" width="140" height="84" rx="7" class="b chat"/><text x="1090.0" y="246.0" class="tt" text-anchor="middle">Sent</text><text x="1090.0" y="263.0" class="ts" text-anchor="middle">delay, typing,</text><text x="1090.0" y="280.0" class="ts" text-anchor="middle">quote if needed</text><polyline points="1090,144 1090,216" class="a" marker-end="url(#m10)"/><rect x="70" y="216" width="150" height="84" rx="7" class="b code"/><text x="145.0" y="246.0" class="tt" text-anchor="middle">React or ignore</text><text x="145.0" y="263.0" class="ts" text-anchor="middle">read at the next</text><text x="145.0" y="280.0" class="ts" text-anchor="middle">phone check</text><polyline points="372,144 200,216" class="a" marker-end="url(#m10)"/><text x="262" y="170" class="lab" text-anchor="middle">react, ignore</text><rect x="250" y="216" width="150" height="84" rx="7" class="b store"/><text x="325.0" y="246.0" class="tt" text-anchor="middle">Life queue</text><text x="325.0" y="263.0" class="ts" text-anchor="middle">defer: waits for</text><text x="325.0" y="280.0" class="ts" text-anchor="middle">a phone check</text><polyline points="426,144 340,216" class="a" marker-end="url(#m10)"/><text x="372" y="176" class="lab" text-anchor="end">defer</text><rect x="250" y="344" width="150" height="84" rx="7" class="b code"/><text x="325.0" y="374.0" class="tt" text-anchor="middle">Phone check</text><text x="325.0" y="391.0" class="ts" text-anchor="middle">one catch-up turn</text><text x="325.0" y="408.0" class="ts" text-anchor="middle">per chat</text><polyline points="325,300 325,344" class="a" marker-end="url(#m10)"/><rect x="440" y="216" width="120" height="84" rx="7" class="b code"/><text x="500.0" y="246.0" class="tt" text-anchor="middle">Silent</text><text x="500.0" y="263.0" class="ts" text-anchor="middle">most lines</text><text x="500.0" y="280.0" class="ts" text-anchor="middle">in a group</text><polyline points="560,144 510,216" class="a" marker-end="url(#m10)"/><text x="543" y="186" class="lab" text-anchor="start">lost the roll</text><rect x="610" y="216" width="180" height="84" rx="7" class="b store"/><text x="700.0" y="246.0" class="tt" text-anchor="middle">Capped</text><text x="700.0" y="263.0" class="ts" text-anchor="middle">one pending per group</text><text x="700.0" y="280.0" class="ts" text-anchor="middle">one attempt</text><polyline points="620,144 690,216" class="a" marker-end="url(#m10)"/><text x="668" y="186" class="lab" text-anchor="start">it would, but a cap says no</text><polyline points="790,258 900,258 900,144" class="a" marker-end="url(#m10)"/><text x="800" y="250" class="lab" text-anchor="start">cap frees</text><polyline points="400,386 950,386 950,144" class="a" marker-end="url(#m10)"/><text x="680" y="378" class="lab" text-anchor="middle">rejoins at the model: no gate, no second roll</text></svg>
