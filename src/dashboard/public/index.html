<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<title>Karyasthan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/chrome.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/views.css">
<link rel="stylesheet" href="/css/touch.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark">K</div>
        <div>
          <div class="brand-name">KARYASTHAN</div>
        </div>
      </div>
    </div>

    <nav id="nav" aria-label="Pages"></nav>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

  <main class="main">

    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Menu">≡ MENU<span class="nav-badge" data-badge="menu" hidden></span></button>
        <div class="topbar-cell active hide-mobile" id="liveCell"><span class="dot-live"></span>LIVE</div>
        <div class="topbar-cell hide-mobile">UPTIME <b id="topUptime">—</b></div>
        <div class="topbar-cell hide-mobile">RATE <b id="topRate">—</b></div>
        <a class="topbar-cell life-badge" id="lifeCell" href="#life" hidden title="Life: availability now">LIFE <b id="topLife">—</b><b id="topLifeAlerts" class="amber" hidden></b></a>
      </div>
      <div class="ticker-box" aria-label="Runtime flags">
        <div class="ticker-track" id="tickerTrack">
          <span>▸ LOADING…</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-cell ro-chip" id="roChip" hidden title="Read-only: DASHBOARD_READONLY is on" aria-label="Read-only: writes are off">RO</span>
        <button type="button" class="topbar-cell guide-btn" id="guideBtn" hidden title="What this page does (press ?)" aria-label="Guide: what this page does">?<span class="hide-mobile">&nbsp;GUIDE</span></button>
        <div class="topbar-cell hide-mobile mono"><span id="clockLocal">—</span> <span id="clockZone"></span></div>
      </div>
    </div>

    <div class="shell-notice" id="shellNotice" role="status" aria-live="polite" hidden></div>
    <nav class="page-tabs" id="pageTabs" aria-label="Pages in this section" hidden></nav>

    <div class="content" id="content" tabindex="-1">
      <div class="loading">LOADING</div>
    </div>
  </main>
</div>

</body>
</html>
